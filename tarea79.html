<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form oninput="resultado.value = parseInt(cantidad.value) * parseInt(precio.value)">
  <label for="cantidad">Cantidad:</label>
  <input type="range" id="cantidad" name="cantidad" min="1" max="10" value="1">
  
  <br><br>
  
  <label for="precio">Precio base ($):</label>
  <input type="number" id="precio" name="precio" value="500">
  
  <br><br>
  
  <strong>Total: $</strong>
  <output name="resultado" for="cantidad precio">500</output>
</form>
    
</body>
</html>
