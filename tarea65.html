<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="/submit">
  <label for="codigo_id">ID de Empleado (Ej: AB1234):</label>
  <input 
    type="text" 
    id="codigo_id" 
    name="codigo_id" 
    pattern="^[A-Z]{2}[0-9]{4}$" 
    title="Debe contener 2 letras mayúsculas y 4 números."
    required>
  <button type="submit">Validar</button>
</form>
    
</body>
</html>
