<body>
    <!-- Progreso de una tarea (0 a 100%) -->
<label for="descarga">Descargando archivos:</label>
<progress id="descarga" value="75" max="100">75%</progress>

<!-- Medidor de estado (Ej: Espacio en disco con umbrales de alerta) -->
<label for="disco">Espacio en Disco C:</label>
<meter id="disco" min="0" max="100" low="20" high="80" optimum="50" value="85">
  85% usado
</meter>
    
</body>
